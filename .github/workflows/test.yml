name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The build script checks the manifest, patch, locales and icon, and
      # syntax-checks both halves; the suite adds the agreement tests on top.
      - run: npm run build
      - run: npm test
